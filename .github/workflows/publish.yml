name: Publish doer-agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      commit:
        description: Exact develop commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-doer-agent
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cranix/doer-agent' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check requested release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'doer-agent' || pkg.version !== process.env.RELEASE_VERSION || process.env.GITHUB_SHA !== process.env.RELEASE_COMMIT) {
            throw new Error('Requested version/commit does not match this checkout');
          }
          JS
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - name: Install test Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('DOER_BROWSER_TEST_EXECUTABLE=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm test
      - name: Publish with npm trusted publishing
        run: npm publish --access public
